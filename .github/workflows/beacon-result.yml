name: Beacon result

on:
  pull_request:
  workflow_dispatch:
    inputs:
      result:
        description: Three-field synthetic result JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -v
      - run: python3 -B -m unittest discover -s mission-pilot -v
      - run: python3 -B -m unittest discover -s discovery-kit -v
      - run: python3 -B -m unittest discover -s autonomous -v
      - run: python3 -B autonomous/beacon_runner.py demo
      - name: Check interoperability with the official MCP Python SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp-sdk"
          "$RUNNER_TEMP/mcp-sdk/bin/python" -m pip install 'mcp==1.26.0'
          "$RUNNER_TEMP/mcp-sdk/bin/python" -B discovery-kit/check_gateway_sdk.py -v
      - name: Build and test the installed Méhecske Connect wheel
        run: |
          python="$RUNNER_TEMP/mcp-sdk/bin/python"
          "$python" -m pip install build twine
          "$python" -m build --outdir "$RUNNER_TEMP/connect-dist"
          "$python" -m twine check --strict "$RUNNER_TEMP/connect-dist/"*
          "$python" -m pip install --no-index --no-deps "$RUNNER_TEMP/connect-dist/"*.whl
          export MEHECSKE_CONNECT_TEST_ENTRYPOINT="$RUNNER_TEMP/mcp-sdk/bin/mehecske-connect"
          "$MEHECSKE_CONNECT_TEST_ENTRYPOINT" --help
          "$python" -B discovery-kit/check_gateway_sdk.py -v

  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Reproduce the result
        env:
          BEACON_RESULT: ${{ inputs.result }}
        run: |
          printf '%s' "$BEACON_RESULT" | python3 -B autonomous/beacon_runner.py verify > receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beacon-verified-result
          path: receipt.json
          retention-days: 1
          if-no-files-found: error
