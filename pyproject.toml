[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "mehecske-connect"
version = "0.1.0"
description = "Run the offline MÃ©hecske Arena MCP Gateway over stdio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/raymondeu1974/mehecske-global-beacon"

[project.scripts]
mehecske-connect = "mehecske_connect:main"

[tool.hatch.build.targets.wheel]
only-include = ["mehecske_connect/__init__.py"]

[tool.hatch.build.targets.wheel.force-include]
"autonomous/beacon_runner.py" = "mehecske_connect/_bundle/autonomous/beacon_runner.py"
"autonomous/feed.json" = "mehecske_connect/_bundle/autonomous/feed.json"
"discovery-kit/arena.py" = "mehecske_connect/_bundle/discovery-kit/arena.py"
"discovery-kit/catalog.json" = "mehecske_connect/_bundle/discovery-kit/catalog.json"
"discovery-kit/fixtures/exact-cover-v1.json" = "mehecske_connect/_bundle/discovery-kit/fixtures/exact-cover-v1.json"
"discovery-kit/fixtures/interval-schedule-v1.json" = "mehecske_connect/_bundle/discovery-kit/fixtures/interval-schedule-v1.json"
"discovery-kit/gateway_stdio.py" = "mehecske_connect/_bundle/discovery-kit/gateway_stdio.py"
"discovery-kit/mcp_stdio.py" = "mehecske_connect/_bundle/discovery-kit/mcp_stdio.py"
"discovery-kit/verify_benchmark.py" = "mehecske_connect/_bundle/discovery-kit/verify_benchmark.py"
"mission-pilot/call.json" = "mehecske_connect/_bundle/mission-pilot/call.json"
"mission-pilot/verify.py" = "mehecske_connect/_bundle/mission-pilot/verify.py"

[tool.hatch.build.targets.sdist]
only-include = [
  ".gitignore",
  "discovery-kit/ARENA.md",
  "discovery-kit/CONNECT.md",
  "discovery-kit/GATEWAY.md",
  "docs/public-private.md",
  "README.md",
  "autonomous/beacon_runner.py",
  "autonomous/feed.json",
  "discovery-kit/arena.py",
  "discovery-kit/catalog.json",
  "discovery-kit/fixtures/exact-cover-v1.json",
  "discovery-kit/fixtures/interval-schedule-v1.json",
  "discovery-kit/gateway_stdio.py",
  "discovery-kit/mcp_stdio.py",
  "discovery-kit/verify_benchmark.py",
  "mehecske_connect/__init__.py",
  "mission-pilot/call.json",
  "mission-pilot/verify.py",
  "pyproject.toml",
  "server.json",
  "skills/mehecske-agent-gateway/SKILL.md",
]
